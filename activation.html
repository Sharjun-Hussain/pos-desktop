<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Inzeedo Activation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #10b981;
            /* Default Dark Mode (Safe default) */
            --bg: #020617;
            --surface: rgba(15, 23, 42, 0.98);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(2, 6, 23, 0.5);
            --shadow: rgba(0, 0, 0, 0.8);
        }

        /* Light Mode Overrides */
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f1f5f9;
                --surface: rgba(255, 255, 255, 0.98);
                --text: #0f172a;
                --text-muted: #64748b;
                --border: rgba(0, 0, 0, 0.05);
                --input-bg: #ffffff;
                --shadow: rgba(15, 23, 42, 0.1);
            }
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            /* Match theme to fix the black box on Linux */
            color: var(--text);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-app-region: drag;
        }

        .glass {
            background: var(--surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px var(--shadow);
        }

        .glow-emerald {
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-app-region: no-drag;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        .input-field {
            -webkit-app-region: no-drag;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
        }

        .input-field:focus {
            border-color: #10b981;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.1);
        }

        .close-btn {
            -webkit-app-region: no-drag;
            transition: all 0.2s;
            color: var(--text-muted);
        }

        .close-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .active-logo {
            animation: pulse 4s infinite ease-in-out;
        }
    </style>
</head>

<body>
    <div class="glass w-[450px] p-8 rounded-[32px] relative text-center">
        <!-- Close Button -->
        <button onclick="window.api.exitApp()"
            class="close-btn absolute top-6 right-6 w-10 h-10 rounded-xl flex items-center justify-center">
            <i class="fas fa-times text-lg"></i>
        </button>

        <!-- Logo Section -->
        <div class="mb-8 mt-4">
            <div
                class="w-20 h-20 bg-emerald-500/10 rounded-3xl flex items-center justify-center mx-auto mb-4 border border-emerald-500/20 glow-emerald active-logo">
                <i class="fas fa-bolt text-4xl text-emerald-500"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-tight">Inzeedo <span class="text-emerald-500 text-2xl">POS</span>
            </h1>
            <p class="text-sm mt-2 font-light" style="color: var(--text-muted)">Software License Activation</p>
        </div>

        <!-- Input Section -->
        <div class="space-y-6">
            <div class="text-left">
                <label class="text-[10px] uppercase tracking-[2px] font-bold ml-1 mb-2 block"
                    style="color: var(--text-muted)">License Key</label>
                <div class="relative">
                    <i class="fas fa-key absolute left-4 top-1/2 -translate-y-1/2" style="color: var(--text-muted)"></i>
                    <input type="text" id="licenseKey" placeholder="XXXX-XXXX-XXXX-XXXX"
                        class="input-field w-full rounded-2xl p-4 pl-12 outline-none font-mono tracking-wider text-sm transition-all shadow-sm">
                </div>
            </div>

            <button id="activateBtn" class="btn-primary w-full py-4 rounded-2xl font-bold shadow-lg">
                Activate Device
            </button>

            <p id="status" class="text-sm font-medium h-6"></p>
        </div>

        <!-- HWID Footer -->
        <div class="mt-8 pt-6 border-t" style="border-color: var(--border)">
            <p class="text-[9px] uppercase tracking-widest font-bold mb-1" style="color: var(--text-muted)">Hardware
                Fingerprint</p>
            <p id="hwidDisplay" class="text-[10px] font-mono truncate opacity-50" style="color: var(--text-muted)">
                Detecting Hardware ID...</p>
        </div>
    </div>

    <script>
        const keyInput = document.getElementById('licenseKey');
        const activateBtn = document.getElementById('activateBtn');
        const status = document.getElementById('status');
        const hwidDisplay = document.getElementById('hwidDisplay');

        // Load HWID
        window.api.getHWID().then(id => {
            hwidDisplay.innerText = id;
        });

        activateBtn.addEventListener('click', async () => {
            const key = keyInput.value.trim();
            if (!key) return showError('Please enter a license key.');

            setLoading(true);
            status.className = 'text-sm font-medium text-emerald-500';
            status.innerText = '📡 Connecting to Inzeedo Secure...';

            const result = await window.api.activateLicense(key);

            if (result.success) {
                status.className = 'text-sm font-medium text-emerald-500';
                status.innerText = ' Activation Successful! Launching...';
                setTimeout(() => window.api.activationComplete(), 1500);
            } else {
                setLoading(false);
                showError(result.message || 'Activation failed.');
            }
        });

        function showError(msg) {
            status.className = 'text-sm font-medium text-red-500';
            status.innerText = ` ${msg}`;
        }

        function setLoading(loading) {
            activateBtn.disabled = loading;
            activateBtn.innerText = loading ? 'Processing...' : 'Activate Device';
            activateBtn.style.opacity = loading ? '0.6' : '1';
        }
    </script>
</body>

</html>
