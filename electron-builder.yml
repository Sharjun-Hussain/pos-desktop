appId: com.inzeedo.pos
productName: Inzeedo POS
copyright: Copyright © 2026 Inzeedo

releaseInfo:
  releaseNotes: |
    v1.1.0
    - Organization Admin Controls: Introduced "Reset Admin Password" for Super Admins.
    - Standardized Naming: Renamed "Suppliers" to "Vendor Registry" and "Branch Hierarchy" to "Branch Registry".
    - Security Fixes: Resolved 403 Forbidden errors during login for active organizations.
    - API Optimization: Migrated administrative actions to the PATCH method for better consistency.
    - Improved Metadata: Updated version across all core components to 1.1.0.

    v1.0.2
    - Layout Fixes: Resolved double-scrollbar issue on the main POS terminal screen.
    - Fullscreen Optimization: The POS terminal now correctly scales to edge-to-edge without sidebar interference.
    - Unified Setup Wizard: Combined activation and database setup into a single modern wizard.
    - Silent Printing: Native OS printer support for receipts and barcode labels without print dialogs.
    - Hardware ID Fix: Consistent device fingerprinting across dev and production environments.

directories:
  output: dist
  buildResources: assets

files:
  - main.js
  - preload.js
  - licensing-service.js
  - setup-wizard.html
  - setup_wizard_banner_*.png
  - package.json
  - node_modules/**
  - assets/**
  - keys/**

extraResources:
  - from: ../backend
    to: backend
    filter:
      - "src/**"
      - "server.js"
      - "package.json"
      - "scripts/**"
      - ".env.example"
      - "!.git/**"
      - "!node_modules/**"
      - "!dist/**"
      - "!logs/**"
  - from: ../electron-desktop/out
    to: frontend

win:
  target: nsis
  icon: assets/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Inzeedo POS
  createDesktopShortcut: true

linux:
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  icon: assets/icon.png
  category: Office
  executableArgs:
    - "--no-sandbox"
  description: Inzeedo POS - Industrial Point of Sale System
  maintainer: Inzeedo (PVT) Ltd.

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0

asar: true
asarUnpack:
  - node_modules/node-machine-id/**
